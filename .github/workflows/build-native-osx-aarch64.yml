name: Build native libraries (macOS aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Vectorscan build dependencies
        run: brew install boost ragel pkg-config

      - name: Clone Vectorscan
        run: git clone --depth 1 --recurse-submodules https://github.com/VectorCamp/vectorscan.git

      - name: Build Vectorscan
        working-directory: vectorscan
        run: |
          cmake -B build -GNinja -DBUILD_SHARED_LIBS=On -DCMAKE_BUILD_TYPE=Release -DFAT_RUNTIME=Off -DBUILD_BENCHMARKS=Off -DBUILD_UNIT=Off -DBUILD_TOOLS=Off -DBUILD_EXAMPLES=Off -DBUILD_DOC=Off
          cmake --build build --config Release -- -j$(nproc)

      - name: Copy Vectorscan shared library
        run: |
          mkdir -p src/main/resources/native/osx/aarch64/
          cp vectorscan/build/lib/libhs.dylib src/main/resources/native/osx/aarch64/

      - name: Build collect_match
        run: ./gradlew buildCollectMatch

      - name: Test
        run: ./gradlew test

      - uses: actions/upload-artifact@v7
        with:
          name: native-osx-aarch64
          path: src/main/resources/native/osx/aarch64/

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-osx-aarch64
          path: src/main/resources/native/osx/aarch64/

      - name: Check for changes
        id: diff
        run: |
          git add src/main/resources/native/
          git diff --staged --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only
          git commit -m "chore: update native libraries (osx/aarch64)"
          git push
