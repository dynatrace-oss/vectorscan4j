name: Build native libraries (Linux aarch64)

on:
  workflow_dispatch:
    inputs:
      cmake_args:
        description: 'Arguments for "cmake -B build" when configuring Vectorscan'
        required: false
        default: '-DBUILD_SHARED_LIBS=On -DCMAKE_BUILD_TYPE=Release -DFAT_RUNTIME=Off -DBUILD_BENCHMARKS=Off -DBUILD_UNIT=Off -DBUILD_TOOLS=Off -DBUILD_EXAMPLES=Off -DBUILD_DOC=Off'
      output_name:
        description: 'File name for the Vectorscan library under src/main/resources/native/linux/aarch64/'
        required: false
        default: 'libhs.so'

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Vectorscan build dependencies
        run: sudo apt-get install -y libboost-dev ragel pkg-config

      - name: Clone Vectorscan
        run: git clone --depth 1 --recurse-submodules https://github.com/VectorCamp/vectorscan.git

      - name: Build Vectorscan
        working-directory: vectorscan
        env:
          CMAKE_ARGS: ${{ inputs.cmake_args }}
        run: |
          cmake -B build $CMAKE_ARGS
          cmake --build build --config Release --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Copy Vectorscan shared library
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          mkdir -p src/main/resources/native/linux/aarch64/
          cp vectorscan/build/lib/libhs.so "src/main/resources/native/linux/aarch64/$OUTPUT_NAME"

      - name: Build buffered match handler
        run: ./gradlew buildBufferedMatchHandler

      - name: Test
        run: ./gradlew test

      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-aarch64
          path: src/main/resources/native/linux/aarch64/

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-aarch64
          path: src/main/resources/native/linux/aarch64/

      - name: Check for changes
        id: diff
        run: |
          git add src/main/resources/native/
          git diff --staged --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only
          git commit -m "chore: update native libraries (linux/aarch64)"
          git push
