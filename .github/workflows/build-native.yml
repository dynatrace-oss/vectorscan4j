name: Build native libraries

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest        # Linux x86_64
            platform: linux
            arch: x86_64
            gradleCmd: ./gradlew
            vectorscanLib: libhs.so
            installDeps: sudo apt-get install -y libboost-dev ragel pkg-config
          - os: ubuntu-24.04-arm     # Linux aarch64
            platform: linux
            arch: aarch64
            gradleCmd: ./gradlew
            vectorscanLib: libhs.so
            installDeps: sudo apt-get install -y libboost-dev ragel pkg-config
          - os: macos-13             # macOS Intel x86_64
            platform: osx
            arch: x86_64
            gradleCmd: ./gradlew
            vectorscanLib: libhs.dylib
            installDeps: brew install boost ragel pkg-config
          - os: macos-latest         # macOS Apple Silicon aarch64
            platform: osx
            arch: aarch64
            gradleCmd: ./gradlew
            vectorscanLib: libhs.dylib
            installDeps: brew install boost ragel pkg-config

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Install Vectorscan build dependencies
        run: ${{ matrix.installDeps }}

      - name: Clone Vectorscan
        run: git clone --depth 1 --recurse-submodules https://github.com/VectorCamp/vectorscan.git

      - name: Build Vectorscan
        working-directory: vectorscan
        run: |
          cmake -B build -DBUILD_SHARED_LIBS=On -DCMAKE_BUILD_TYPE=Release -DFAT_RUNTIME=Off -DBUILD_BENCHMARKS=Off -DBUILD_UNIT=Off -DBUILD_TOOLS=Off -DBUILD_EXAMPLES=Off -DBUILD_DOC=Off
          cmake --build build --config Release -- -j$(nproc)

      - name: Copy Vectorscan shared library
        run: |
          mkdir -p src/main/resources/native/${{ matrix.platform }}/${{ matrix.arch }}/
          cp vectorscan/build/lib/${{ matrix.vectorscanLib }} src/main/resources/native/${{ matrix.platform }}/${{ matrix.arch }}/

      - name: Build collect_match
        run: ${{ matrix.gradleCmd }} buildCollectMatch

      - name: Test
        run: ${{ matrix.gradleCmd }} test

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: src/main/resources/native/${{ matrix.platform }}/${{ matrix.arch }}/

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x86_64
          path: src/main/resources/native/linux/x86_64/

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-aarch64
          path: src/main/resources/native/linux/aarch64/

      - uses: actions/download-artifact@v8
        with:
          name: native-osx-x86_64
          path: src/main/resources/native/osx/x86_64/

      - uses: actions/download-artifact@v8
        with:
          name: native-osx-aarch64
          path: src/main/resources/native/osx/aarch64/

      - name: Check for changes
        id: diff
        run: |
          git add src/main/resources/native/
          git diff --staged --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update native libraries"
          git push
