name: Build native libraries

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest        # Linux x86_64
            platform: linux
            arch: x86_64
            gradleCmd: ./gradlew
          - os: ubuntu-24.04-arm     # Linux aarch64
            platform: linux
            arch: aarch64
            gradleCmd: ./gradlew
          - os: macos-13             # macOS Intel x86_64
            platform: osx
            arch: x86_64
            gradleCmd: ./gradlew
          - os: macos-latest         # macOS Apple Silicon aarch64
            platform: osx
            arch: aarch64
            gradleCmd: ./gradlew
#          - os: windows-latest       # Windows x86_64
#            platform: windows
#            arch: x86_64
#            gradleCmd: gradlew.bat

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Build
        run: ${{ matrix.gradleCmd }} buildCollectMatch

      - name: Test
        run: ${{ matrix.gradleCmd }} test

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: src/main/resources/native/${{ matrix.platform }}/${{ matrix.arch }}/

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x86_64
          path: src/main/resources/native/linux/x86_64/

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-aarch64
          path: src/main/resources/native/linux/aarch64/

      - uses: actions/download-artifact@v8
        with:
          name: native-osx-x86_64
          path: src/main/resources/native/osx/x86_64/

      - uses: actions/download-artifact@v8
        with:
          name: native-osx-aarch64
          path: src/main/resources/native/osx/aarch64/

      - name: Check for changes
        id: diff
        run: |
          git add src/main/resources/native/
          git diff --staged --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v6
        if: steps.diff.outputs.changed == 'true'
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
        if: steps.diff.outputs.changed == 'true'

      - name: Run unit tests
        if: steps.diff.outputs.changed == 'true'
        run: ./gradlew test

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update compiled native libraries"
          git push
