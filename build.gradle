plugins {
    id "java-library"
    id "maven-publish"
    id "signing"
    id "com.diffplug.spotless" version "8.3.0"
    id "jacoco"
}

group = "com.dynatrace.vectorscan4j"
version = "0.6.0-SNAPSHOT"

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    dependsOn test

    // VectorscanNative is generated bindings (jextract-style); it is excluded from the report.
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: ['com/dynatrace/vectorscan4j/internal/VectorscanNative*.class'])
    }))

    reports {
        html.required.set(true)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.7.1"
}

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    jvmArgs = [
            "--enable-native-access=ALL-UNNAMED"
    ]
}

// Generate Java bindings from a C/C++ header using jextract.
// Usage: ./gradlew jextract -PinputFile=<relative-path-to-header>
// Output is placed in the same directory as the input file.
tasks.register('jextract') {
    group = 'native'
    doFirst {
        if (!project.hasProperty('inputFile')) {
            throw new GradleException(
                    'No input file specified. Usage: ./gradlew jextract -PinputFile=<path>')
        }
        def inputFile = file(project.property('inputFile'))
        if (!inputFile.exists()) {
            throw new GradleException("File not found: ${inputFile.absolutePath}")
        }
        try {
            new ProcessBuilder('jextract', '--version')
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
        } catch (IOException e) {
            throw new GradleException(
                    'jextract is not installed or not on PATH. ' +
                    'Download it from https://jdk.java.net/jextract/')
        }
        def proc = new ProcessBuilder(
                        'jextract', '--output', inputFile.parentFile.absolutePath, inputFile.absolutePath)
                .inheritIO()
                .start()
        def exitCode = proc.waitFor()
        if (exitCode != 0) {
            throw new GradleException("jextract failed with exit code ${exitCode}")
        }
    }
}

// Compiles buffered_match_handler.cpp into the bundled library for this platform and architecture,
// under src/main/resources/native/<os>/<arch>/, so it is committed and bundled in the JAR automatically.
// Run manually with ./gradlew buildBufferedMatchHandler on each platform when the C++ source changes.
def nativeSrcDir = file("src/main/resources/native")
def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()
def osPart = osName.contains("mac") ? "osx" : osName.contains("win") ? "windows" : "linux"
def archPart = osArch == "amd64" ? "x86_64" : osArch  // normalize amd64 → x86_64
def nativeOutDir = file("src/main/resources/native/${osPart}/${archPart}")
def bufferedSrc = file("${nativeSrcDir}/buffered_match_handler.cpp")
def bufferedOut = new File(nativeOutDir, System.mapLibraryName("buffered_match_handler"))
def sharedFlag = osPart == "osx" ? "-dynamiclib" : "-shared"

tasks.register('buildBufferedMatchHandler', Exec) {
    inputs.file(bufferedSrc)
    outputs.file(bufferedOut)
    doFirst { nativeOutDir.mkdirs() }
    commandLine 'c++', '-std=c++17', '-O3', '-fPIC', sharedFlag,
            bufferedSrc.absolutePath, '-o', bufferedOut.absolutePath
}

// The bundled native libraries are not in git. The natives workflow (.github/workflows/natives.yml) builds
// them, and the release workflow attaches them to the GitHub release as vectorscan4j-natives.zip.
// ./gradlew downloadNatives fetches them from the latest release (or -PnativesTag=vX.Y.Z, which also
// works for draft releases); it needs the GitHub CLI, logged in.
def nativePlatforms = [linux: ['x86_64', 'aarch64'], osx: ['aarch64']]
def nativeLibs = ['hs', 'buffered_match_handler']
def nativesArchive = layout.buildDirectory.file('natives/vectorscan4j-natives.zip').get().asFile

tasks.register('fetchNativesArchive', Exec) {
    def tag = project.findProperty('nativesTag')
    outputs.file(nativesArchive)
    outputs.upToDateWhen { false }
    doFirst { nativesArchive.parentFile.mkdirs() }
    commandLine(['gh', 'release', 'download'] + (tag ? [tag] : []) + [
            '--repo', 'dynatrace-oss/vectorscan4j', '--pattern', nativesArchive.name,
            '--dir', nativesArchive.parent, '--clobber'])
}

tasks.register('downloadNatives', Copy) {
    group = 'native'
    description = 'Downloads the bundled native libraries from a GitHub release (latest, or -PnativesTag=vX.Y.Z).'
    dependsOn 'fetchNativesArchive'
    from(zipTree(nativesArchive))
    into(nativeSrcDir)
}

// Maven Central versions cannot be replaced, so never publish a jar that lacks a platform's libraries.
tasks.register('verifyNatives') {
    group = 'native'
    description = 'Fails if any bundled native library is missing from src/main/resources/native.'
    def expected = nativePlatforms.collectMany { os, arches ->
        arches.collectMany { arch ->
            nativeLibs.collect { lib -> new File(nativeSrcDir, "${os}/${arch}/lib${lib}.${os == 'osx' ? 'dylib' : 'so'}") }
        }
    }
    doLast {
        def missing = expected.findAll { !it.isFile() }
        if (missing) {
            throw new GradleException("Missing native libraries:\n  ${missing.join('\n  ')}\n" +
                    'Run ./gradlew downloadNatives, or build them with the natives workflow.')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach { dependsOn 'verifyNatives' }

// buildBufferedMatchHandler and downloadNatives write into src/main/resources, which these tasks consume
// as input. Order them when both are scheduled; deliberately not dependsOn, so a normal build does not
// trigger a native rebuild or download.
['processResources', 'sourcesJar'].each { consumer ->
    tasks.named(consumer).configure { mustRunAfter 'buildBufferedMatchHandler', 'downloadNatives', 'verifyNatives' }
}

// The native callback libraries used by NativeMatchHandlerTests are no longer built as a Gradle
// task: that made every `test` invocation compile them regardless of which tests were selected.
// NativeMatchHandlerTests.buildNativeCallbacks() now compiles them itself in @BeforeAll, only when
// that class actually runs, with its own staleness check against the .cpp files.

spotless {
    java {
        palantirJavaFormat("2.90.0")
        licenseHeaderFile rootProject.file('spotless/HEADER.java')
    }
}

tasks.named("jar") {
    from("THIRD_PARTY_NOTICES.md") {
        into("META-INF")
        rename { "THIRD_PARTY_NOTICES.txt" }
    }
    from("LICENSE") {
        into("META-INF")
    }
    exclude("native/vectorscan.h")
    exclude("native/CMakeLists.txt")
}

tasks.named("sourcesJar") {
    exclude("native/vectorscan.h")
    exclude("native/CMakeLists.txt")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = "vectorscan4j"
                description = "A Java wrapper for the Vectorscan pattern matching engine"
                url = "https://github.com/dynatrace-oss/vectorscan4j"
                licenses {
                    license {
                        name = "Apache License 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "Dynatrace"
                        name = "Dynatrace LLC"
                        email = "opensource@dynatrace.com"
                    }

                }
                scm {
                    connection = "scm:git:git://github.com/dynatrace-oss/vectorscan4j.git"
                    developerConnection = "scm:git:ssh://github.com/dynatrace-oss/vectorscan4j.git"
                    url = "https://github.com/dynatrace-oss/vectorscan4j"
                }
            }
        }
    }
    repositories {
        maven {
            url = "$projectDir/build/mavencentral/repo"
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.mavenJava
}

tasks.register("createRepoForUploadToMavenCentral", Zip) {
    dependsOn build, publish
    from "$projectDir/build/mavencentral/repo"
    destinationDirectory = file("$projectDir/build/mavencentral")
    archiveFileName = "repo.zip"
}
