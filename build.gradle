plugins {
    id "java-library"
    id "maven-publish"
    id "signing"
    id "com.diffplug.spotless" version "8.3.0"
    id "jacoco"
}

group = "com.dynatrace.vectorscan4j"
version = "0.5.0-SNAPSHOT"

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required.set(true)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.7.1"
}

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    jvmArgs = [
            "--enable-native-access=ALL-UNNAMED"
    ]
    systemProperty "vs4j.native.countMatches",
            layout.buildDirectory.file("native/libvs4j_count_matches.so").get().asFile.absolutePath
}

// Generate Java bindings from a C/C++ header using jextract.
// Usage: ./gradlew jextract -PinputFile=<relative-path-to-header>
// Output is placed in the same directory as the input file.
tasks.register('jextract') {
    group = 'native'
    doFirst {
        if (!project.hasProperty('inputFile')) {
            throw new GradleException(
                    'No input file specified. Usage: ./gradlew jextract -PinputFile=<path>')
        }
        def inputFile = file(project.property('inputFile'))
        if (!inputFile.exists()) {
            throw new GradleException("File not found: ${inputFile.absolutePath}")
        }
        try {
            new ProcessBuilder('jextract', '--version')
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
        } catch (IOException e) {
            throw new GradleException(
                    'jextract is not installed or not on PATH. ' +
                    'Download it from https://jdk.java.net/jextract/')
        }
        def proc = new ProcessBuilder(
                        'jextract', '--output', inputFile.parentFile.absolutePath, inputFile.absolutePath)
                .inheritIO()
                .start()
        def exitCode = proc.waitFor()
        if (exitCode != 0) {
            throw new GradleException("jextract failed with exit code ${exitCode}")
        }
    }
}

// Utility task: compile collect_match.cpp and deposit the result directly into
// src/main/resources so it is committed and bundled in the JAR automatically.
// Run manually with ./gradlew buildCollectMatch when the C++ source changes.
def nativeSrcDir = file("src/main/resources/native")
def cmakeBuildDir = layout.buildDirectory.dir("cmake-native").get().asFile
def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()
def osPart = osName.contains("mac") ? "osx" : osName.contains("win") ? "windows" : "linux"
def archPart = osArch == "amd64" ? "x86_64" : osArch  // normalize amd64 → x86_64
def nativeOutDir = file("src/main/resources/native/${osPart}/${archPart}")

tasks.register('cmakeConfigure', Exec) {
    inputs.file("${nativeSrcDir}/CMakeLists.txt")
    inputs.file("${nativeSrcDir}/collect_match.cpp")
    outputs.dir(cmakeBuildDir)
    doFirst { cmakeBuildDir.mkdirs() }
    commandLine 'cmake',
            '-S', nativeSrcDir.absolutePath,
            '-B', cmakeBuildDir.absolutePath,
            "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${nativeOutDir.absolutePath}",
            "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY_RELEASE=${nativeOutDir.absolutePath}",
            "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${nativeOutDir.absolutePath}",
            "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=${nativeOutDir.absolutePath}"
}

tasks.register('buildCollectMatch', Exec) {
    dependsOn 'cmakeConfigure'
    inputs.file("${nativeSrcDir}/collect_match.cpp")
    outputs.dir(nativeOutDir)
    doFirst { nativeOutDir.mkdirs() }
    commandLine 'cmake', '--build', cmakeBuildDir.absolutePath, '--config', 'Release'
}

// Build a tiny native shared library used by tests that exercise the
// no-upcall scan path (see NativeMatchHandler). Skipped silently if cc is missing.
tasks.register('buildTestNativeCallback', Exec) {
    def srcDir = file("src/test/native")
    def outDir = layout.buildDirectory.dir("native").get().asFile
    inputs.dir(srcDir)
    outputs.dir(outDir)
    doFirst { outDir.mkdirs() }
    ignoreExitValue = true
    commandLine 'sh', '-c',
            "command -v cc >/dev/null 2>&1 && " +
            "cc -std=c11 -O3 -fPIC -shared " +
            "-o ${outDir}/libvs4j_count_matches.so " +
            "${srcDir}/count-matches-native.c || " +
            "echo 'cc not available or build failed; native-callback tests will be skipped.'"
}

tasks.named('test').configure { dependsOn 'buildTestNativeCallback' }

spotless {
    java {
        palantirJavaFormat("2.90.0")
        licenseHeaderFile rootProject.file('spotless/HEADER.java')
    }
}

tasks.named("jar") {
    from("THIRD_PARTY_NOTICES.md") {
        into("META-INF")
        rename { "THIRD_PARTY_NOTICES.txt" }
    }
    from("LICENSE") {
        into("META-INF")
    }
    exclude("native/vectorscan.h")
    exclude("native/CMakeLists.txt")
}

tasks.named("sourcesJar") {
    exclude("native/vectorscan.h")
    exclude("native/CMakeLists.txt")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = "vectorscan4j"
                description = "A Java wrapper for the Vectorscan pattern matching engine"
                url = "https://github.com/dynatrace-oss/vectorscan4j"
                licenses {
                    license {
                        name = "Apache License 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "Dynatrace"
                        name = "Dynatrace LLC"
                        email = "opensource@dynatrace.com"
                    }

                }
                scm {
                    connection = "scm:git:git://github.com/dynatrace-oss/vectorscan4j.git"
                    developerConnection = "scm:git:ssh://github.com/dynatrace-oss/vectorscan4j.git"
                    url = "https://github.com/dynatrace-oss/vectorscan4j"
                }
            }
        }
    }
    repositories {
        maven {
            url = "$projectDir/build/mavencentral/repo"
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.mavenJava
}

tasks.register("createRepoForUploadToMavenCentral", Zip) {
    dependsOn build, publish
    from "$projectDir/build/mavencentral/repo"
    destinationDirectory = file("$projectDir/build/mavencentral")
    archiveFileName = "repo.zip"
}
