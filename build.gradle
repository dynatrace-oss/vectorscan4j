plugins {
    id "java-library"
    id "maven-publish"
    id "signing"
    id "me.champeau.jmh" version "0.7.3"
    id "com.diffplug.spotless" version "8.3.0"
    id "jacoco"
}

group = "com.dynatrace.vectorscan4j"
version = "0.2.1-SNAPSHOT"

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required.set(true)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.7.1"
    jmhImplementation "org.openjdk.jmh:jmh-core:1.37"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:1.37"
}

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    maxHeapSize = "4g"
    jvmArgs = [
            "-Xlog:gc=debug:stdout",
            "-XX:+HeapDumpOnOutOfMemoryError",
            "-XX:HeapDumpPath=${layout.buildDirectory}/heapdumps",
            "--enable-native-access=ALL-UNNAMED"
    ]
    systemProperty "vs4j.native.countMatches",
            layout.buildDirectory.file("native/libvs4j_count_matches.so").get().asFile.absolutePath
}

// Build a tiny native shared library used by tests/benchmarks that exercise the
// no-upcall scan path (see NativeMatchHandler). Skipped silently if cmake is missing.
tasks.register('buildTestNativeCallback', Exec) {
    def srcDir = file("src/test/native")
    def outDir = layout.buildDirectory.dir("native").get().asFile
    inputs.dir(srcDir)
    outputs.dir(outDir)
    doFirst { outDir.mkdirs() }
    ignoreExitValue = true
    commandLine 'sh', '-c',
            "command -v cmake >/dev/null 2>&1 && " +
            "cmake -S ${srcDir} -B ${outDir} -DCMAKE_BUILD_TYPE=Release && " +
            "cmake --build ${outDir} --config Release || " +
            "echo 'cmake not available or build failed; native-callback tests will be skipped.'"
}

tasks.named('test').configure { dependsOn 'buildTestNativeCallback' }
tasks.matching { it.name == 'jmh' }.configureEach { dependsOn 'buildTestNativeCallback' }

spotless {
    java {
        palantirJavaFormat("2.90.0")
        targetExclude "src/jmh/java/com/dynatrace/utils/RegexGenerator.java"
        licenseHeaderFile rootProject.file('spotless/HEADER.java')
    }

    format('javaWithAttribution') {
        target "src/jmh/java/com/dynatrace/utils/RegexGenerator.java"
        licenseHeaderFile rootProject.file('spotless/HEADER_WITH_ATTRIBUTION.java'), 'package '
    }
}

jmh {
    includeTests = false
}

tasks.named("jar") {
    from("THIRD_PARTY_NOTICES.md") {
        into("META-INF")
        rename { "THIRD_PARTY_NOTICES.txt" }
    }
    from("LICENSE") {
        into("META-INF")
    }
    exclude("native/vectorscan.h")
}

tasks.named("sourcesJar") {
    exclude("native/vectorscan.h")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = "vectorscan4j"
                description = "A Java wrapper for the Vectorscan pattern matching engine"
                url = "https://github.com/dynatrace-oss/vectorscan4j"
                licenses {
                    license {
                        name = "Apache License 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "Dynatrace"
                        name = "Dynatrace LLC"
                        email = "opensource@dynatrace.com"
                    }

                }
                scm {
                    connection = "scm:git:git://github.com/dynatrace-oss/vectorscan4j.git"
                    developerConnection = "scm:git:ssh://github.com/dynatrace-oss/vectorscan4j.git"
                    url = "https://github.com/dynatrace-oss/vectorscan4j"
                }
            }
        }
    }
    repositories {
        maven {
            url = "$projectDir/build/mavencentral/repo"
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.mavenJava
}

tasks.register("createRepoForUploadToMavenCentral", Zip) {
    dependsOn build, publish
    from "$projectDir/build/mavencentral/repo"
    destinationDirectory = file("$projectDir/build/mavencentral")
    archiveFileName = "repo.zip"
}
